<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flocchini Estate Vineyards | Petaluma Gap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        /* CSS VARIABLES & RESET */
        :root {
            --obsidian: #111111;
            --white: #ffffff;
            --alabaster: #f7f6f2;
            --taupe: #8c8279;
            --thin-border: rgba(17, 17, 17, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--obsidian);
            background-color: var(--white);
            line-height: 1.8;
            font-size: 14px;
            font-weight: 300;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .serif {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            margin: 0;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        /* ====================================================
           BASE STYLES (MOBILE-FIRST)
           These apply to all screens by default.
        ==================================================== */

        header {
            position: fixed;
            width: 100%;
            top: 0;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.98);
            border-bottom: 1px solid var(--thin-border);
            z-index: 1000;
            transition: background 0.4s ease, padding 0.4s ease;
        }
        
        .logo { 
            font-size: 24px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            color: var(--obsidian); 
            text-decoration: none; 
            margin-bottom: 10px;
            cursor: pointer; 
            transition: color 0.4s ease;
        }
        
        nav { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
            line-height: 1.5; 
        }
        
        nav a { 
            text-decoration: none; 
            color: var(--obsidian); 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: opacity 0.3s ease; 
        }
        nav a:hover { opacity: 0.5; }

        .
